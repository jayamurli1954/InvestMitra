name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key
      DB_NAME: investmitra_ci
      MONGO_URL: mongodb://localhost:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests (if present)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          test_files=(tests/test_*.py tests/*_test.py backend/tests/test_*.py backend/tests/*_test.py)
          if [ ${#test_files[@]} -eq 0 ]; then
            echo "No backend tests found. Skipping pytest."
            exit 0
          fi
          python -m pytest -q "${test_files[@]}"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build
