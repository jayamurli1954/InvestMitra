name: CD

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render and Vercel hooks
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger deploy hooks
        run: |
          set -euo pipefail

          triggered=0

          if [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "Triggering Render deploy hook..."
            curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK_URL"
            triggered=1
          fi

          if [ -n "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "Triggering Vercel deploy hook..."
            curl --fail --show-error --silent -X POST "$VERCEL_DEPLOY_HOOK_URL"
            triggered=1
          fi

          if [ "$triggered" -eq 0 ]; then
            echo "::warning::No deploy hooks configured. Set RENDER_DEPLOY_HOOK_URL and/or VERCEL_DEPLOY_HOOK_URL in repository secrets."
          fi
